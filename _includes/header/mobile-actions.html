<!-- Mobile Header Actions (Search + Theme + Hamburger) -->
<div class="header-mobile-actions">
  {% include header/search-bar.html class="mobile-search-btn" label="Search notes" %}
  {% include header/theme-toggle.html class="mobile-theme-btn" %}

  <!-- Hamburger Button with Animated Native SVG Lines -->
  <button class="hamburger-btn" id="hamburgerBtn" type="button" aria-label="Open Menu" aria-expanded="false" aria-controls="mobileNav">
    <svg class="icon-ham" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
    <svg class="icon-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
</div>
