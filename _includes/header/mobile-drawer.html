<!-- Mobile Drawer Backdrop -->
<div class="mobile-drawer-backdrop" id="mobileDrawerBackdrop"></div>

<!-- Mobile Side Drawer -->
<aside class="mobile-app-drawer" id="mobileNav" aria-label="Mobile Navigation">
  <!-- 1. Drawer User Profile Header -->
  <div class="drawer-profile-header">
    <div class="drawer-avatar" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
    </div>
    <div class="drawer-user-details">
      <h3 class="drawer-user-title">IncStudy</h3>
      <p class="drawer-user-subtitle">{{ site.data.navigation.brand_tagline | default: 'Learn Today. Grow Tomorrow.' }}</p>
    </div>
  </div>

  <!-- 2. Drawer Navigation Items -->
  <div class="drawer-content-scroll">
    <div class="drawer-section-label">Main Navigation</div>

    <a href="{{ '/' | relative_url }}" class="drawer-item{% if page.url == '/' %} active{% endif %}">
      <span class="drawer-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </span>
      <span class="drawer-label">Home</span>
    </a>

    <a href="{{ '/ccsu/bca/semester-1/' | relative_url }}" class="drawer-item{% if page.url contains '/ccsu/bca/semester-1/' %} active{% endif %}">
      <span class="drawer-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
      </span>
      <span class="drawer-label">Important Questions</span>
    </a>

    <a href="{{ '/about/' | relative_url }}" class="drawer-item{% if page.url == '/about/' %} active{% endif %}">
      <span class="drawer-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      </span>
      <span class="drawer-label">About</span>
    </a>

    <a href="{{ '/contact/' | relative_url }}" class="drawer-item{% if page.url == '/contact/' %} active{% endif %}">
      <span class="drawer-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
      </span>
      <span class="drawer-label">Contact</span>
    </a>

    <div class="drawer-divider"></div>
    <div class="drawer-section-label">Preferences</div>

    <!-- In-Drawer Dark Theme Toggle -->
    <div class="drawer-item drawer-item-action" id="drawerThemeToggle" role="button" tabindex="0" aria-label="Toggle dark and light mode">
      <div style="display: flex; align-items: center; gap: 14px;">
        <span class="drawer-icon" aria-hidden="true">
          <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
          </svg>
          <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </span>
        <span class="drawer-label">Dark Theme</span>
      </div>
      <div class="drawer-switch-track" id="drawerSwitchTrack">
        <div class="drawer-switch-knob"></div>
      </div>
    </div>
  </div>

  <!-- 3. Drawer Footer -->
  <div class="drawer-footer">
    <span>IncStudy · {{ site.data.navigation.brand_tagline | default: 'Learn Today. Grow Tomorrow.' }}</span>
  </div>
</aside>
