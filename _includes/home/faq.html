{% assign fq = site.data.homepage.faq %}
<section class="home-section home-section-tight" id="faq">
  <div class="home-container">
    <div class="section-header-stack faq-header-center">
      <h2 class="section-heading-lg">{{ fq.title }}</h2>
      <p class="section-subcopy">{{ fq.subtitle }}</p>
    </div>

    <div class="faq-list">
      {% for item in fq.items %}
      <details class="faq-item"{% if forloop.first %} open{% endif %}>
        <summary class="faq-question">
          <span>{{ item.q }}</span>
          <span class="faq-chevron" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </span>
        </summary>
        <div class="faq-answer">
          <p>{{ item.a }}</p>
        </div>
      </details>
      {% endfor %}
    </div>
  </div>

  <!-- FAQPage Structured Data for Google Search -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {% for item in fq.items %}
      {
        "@type": "Question",
        "name": {{ item.q | jsonify }},
        "acceptedAnswer": {
          "@type": "Answer",
          "text": {{ item.a | jsonify }}
        }
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]
  }
  </script>
</section>
