<meta property="og:type" content="website"><meta property="og:site_name" content="{{ site.title | escape }}"><meta property="og:title" content="{{ page.seo_title | default: page.title | escape }}"><meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}"><meta property="og:url" content="{{ page.url | absolute_url }}"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="{{ page.seo_title | default: page.title | escape }}"><meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
