<aside class="sidebar sidebar-left" aria-label="Course navigation"><div class="sidebar-heading">Study navigation</div><nav class="sidebar-nav">{% for item in site.data.sidebar.course %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.label }}</a>{% endfor %}</nav>{% if page.semesters %}<div class="sidebar-section"><h2>Semesters</h2>{% for item in page.semesters %}<a href="{{ item.url | relative_url }}">{{ item.label }}</a>{% endfor %}</div>{% endif %}</aside>
