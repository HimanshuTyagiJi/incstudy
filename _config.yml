title: IncStudy
description: Complete BCA study material, semester-wise notes, university syllabus, previous year question papers, and line-by-line programming solutions.
url: "https://incstudy.com"
baseurl: ""
lang: en-IN
timezone: Asia/Kolkata
markdown: kramdown
permalink: pretty
collections:
  topics:
    output: true
    permalink: /bca/topics/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      type: topics
    values:
      layout: notes
exclude: [Gemfile, Gemfile.lock, README.md, LICENSE, node_modules, vendor, .github, scratch]
