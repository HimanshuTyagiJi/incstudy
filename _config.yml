title: IncStudy
description: BCA notes, syllabus, previous year papers and study material organised by university, semester and subject.
url: "https://incstudy.com"
baseurl: ""
lang: en-IN
timezone: Asia/Kolkata
markdown: kramdown
permalink: pretty
collections:
  topics:
    output: true
    permalink: /bca/topics/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      type: topics
    values:
      layout: notes
exclude: [Gemfile, Gemfile.lock, README.md, LICENSE, node_modules, vendor, .github, scratch]
